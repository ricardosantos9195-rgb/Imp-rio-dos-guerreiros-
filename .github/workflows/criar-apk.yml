name: Criar APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar projeto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Preparar APK para download direto
        run: cp app/build/outputs/apk/debug/app-debug.apk Imperio-dos-Guerreiros-v0.60.apk
      - name: Publicar versão para Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.60 Imperio-dos-Guerreiros-v0.60.apk --title "Império dos Guerreiros v0.60 — Guerra Mundial" --notes "Mapa mundial com três zonas, montanhas, portões conquistáveis, território conectado, fortaleza e torres de aliança, Super-Mina, chefes mitológicos, rallies e Trono Supremo."
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Imperio-dos-Guerreiros-v0.60-APK
          path: app/build/outputs/apk/debug/app-debug.apk
