name: Criar APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar projeto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Preparar APK para download direto
        run: cp app/build/outputs/apk/debug/app-debug.apk Imperio-dos-Guerreiros-v0.55.apk
      - name: Publicar versão para Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.55 Imperio-dos-Guerreiros-v0.55.apk --title "Império dos Guerreiros v0.55 — Novo Motor do Mapa" --notes "Reconstrói o mapa num motor DOM compatível com Android: Senado inicial, 28 alvos próximos, terreno navegável, zoom, pesquisa, coordenadas e menus no modo convidado."
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Imperio-dos-Guerreiros-v0.55-APK
          path: app/build/outputs/apk/debug/app-debug.apk
